[tool.poetry]
name = "orders_service"
version = "0.1.0"
description = "Proyecto final integrador - Orders Service con Arquitectura Hexagonal"
authors = ["FJRivera"]
readme = "README.md"
packages = [{ include = "orders_service", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"

# API
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }

# Validación
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
email-validator = "^2.2.0"

# Base de datos
sqlalchemy = "^2.0.35"
alembic = "^1.13.0"

# Seguridad
pwdlib = {extras = ["argon2"], version = "^0.3.0"}
pyjwt = "^2.9.0"

# Utilidades
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"

# Calidad
ruff = "^0.6.0"
mypy = "^1.11.0"

# Auditoría
pip-audit = "^2.7.0"

# Tipos adicionales
types-pyjwt = "^1.7.1"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src/orders_service --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"